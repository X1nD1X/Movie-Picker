<style>

#side{animation:inL .4s ease}#side.leave{animation:outL .35s ease forwards}#app{animation:inR .4s ease}#bar{display:none}

);display:grid;place-items:center;padding:20px}.introbox{max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.introbox h3{margin:0 0 12px;font-size:20px}.introbox ol{padding-left:20px;margin:0 0 6px}.introbox li{margin:8px 0}#jc:not(:placeholder-shown){text-transform:uppercase;letter-spacing:.15em;font-weight:600}.rnd{width:100%;margin-top:14px;background:transparent;border:1px dashed var(--pink);color:var(--pink);border-radius:12px;padding:10px}

@keyframes hi{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){.hello{animation:none}}
@media(max-width:480px){.ticket{grid-template-columns:90px 1fr}.vote .ticket,.match .ticket{grid-template-columns:110px 1fr}.row,.names{grid-template-columns:1fr}}

</head>
<body>
<div id="hello" class="hello" role="status">Привет! Что посмотрим?</div>
<div class="wrap">
<header><h1>What We Watch?</h1><p class="sub">YOUR NEXT MOVIE STARTS HERE.</p></header>
<div class="layout"><aside id="side" class="panel"></aside><div id="bar"><button class="barbtn" data-act="back">← Фильтры</button><button class="barbtn" id="help" data-act="help" aria-label="Как это работает">?</button></div><main id="app"></main></div>
<footer>Данные о фильмах: TMDB. Этот сайт использует API TMDB, но не одобрен и не сертифицирован TMDB.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Адрес вашего прокси (Cloudflare Worker), без слэша в конце. Ключ TMDB хранится только на нём, в коде сайта ключа нет.

const GM = {28:'Боевик',12:'Приключения',16:'Мультфильм',35:'Комедия',80:'Криминал',99:'Документальный',18:'Драма',10751:'Семейный',14:'Фэнтези',36:'История',27:'Ужасы',10402:'Музыка',9648:'Детектив',10749:'Мелодрама',878:'Фантастика',53:'Триллер',10752:'Военный',37:'Вестерн'};
const GT = {10759:'Боевик и приключения',16:'Мультфильм',35:'Комедия',80:'Криминал',99:'Документальный',18:'Драма',10751:'Семейный',10762:'Детский',9648:'Детектив',10764:'Реалити',10765:'Фантастика и фэнтези',10766:'Мыльная опера',10767:'Ток-шоу',10768:'Война и политика',37:'Вестерн'};
const NAMES = {...GM, ...GT}, KIND = {movie:'Фильм', tv:'Сериал', anim:'Мультфильм'};
const POP = {movie:[35,18,28,53,878,27,10749,16], tv:[35,18,10759,80,9648,10765]};
// настроение: [жанры для фильмов, жанры для сериалов или null, если у сериалов нет подходящего жанра]
const MOODS = {'😂 Посмеяться':[[35],[35]],'😱 Страшно':[[27],null],'💜 Романтика':[[10749],null],'😢 До слёз':[[18],[18]],'🧠 Поломать голову':[[9648,53],[9648]],'😬 Напряжение':[[53,80],[80,9648]],'✨ Магия':[[14],[10765]],'🚀 Другие миры':[[878],[10765]],'💥 Адреналин':[[28,12],[10759]],'🌿 Расслабиться':[[10751,35],[10751,35]]};
const PRESETS = {'🍕 Лёгкий вечер':{g:[35,10751]},'❤️ Свидание':{g:[10749,35]},'👻 Ночь ужасов':{g:[27,53]},'🧠 Вечер загадок':{g:[9648,53,80]},'👨‍👩‍👧 Семейный':{g:[10751]},'🌌 Другие миры':{g:[878,14]},'🎞 Классика':{g:[]}};
const RUNTIME = {'':['Любая',''],lt100:['До 100 мин','&with_runtime.lte=100'],mid:['100–130 мин','&with_runtime.gte=100&with_runtime.lte=130'],gt130:['От 130 мин','&with_runtime.gte=130']};
const RATING = {'0':'Любой','6':'6 и выше','7':'7 и выше','8':'8 и выше'};
const Y = new Date().getFullYear();
const ERAS = {'':['Любые',''],old:['До 2000 года','&primary_release_date.lte=1999-12-31'],1970:['1970-е','&primary_release_date.gte=1970-01-01&primary_release_date.lte=1979-12-31'],1980:['1980-е','&primary_release_date.gte=1980-01-01&primary_release_date.lte=1989-12-31'],1990:['1990-е','&primary_release_date.gte=1990-01-01&primary_release_date.lte=1999-12-31'],2000:['2000-е','&primary_release_date.gte=2000-01-01&primary_release_date.lte=2009-12-31'],2010:['2010-е','&primary_release_date.gte=2010-01-01&primary_release_date.lte=2019-12-31'],2020:['2020-е','&primary_release_date.gte=2020-01-01&primary_release_date.lte=2029-12-31'],now:['Этот год ('+Y+')','&primary_release_date.gte='+Y+'-01-01&primary_release_date.lte='+Y+'-12-31']};

const introHTML = on => `<div class="intro" id="intro" role="dialog" aria-modal="true" aria-label="Как это работает"><div class="introbox"><h3>Как это работает</h3><ol><li>${on ? 'Вы оба видите один и тот же фильм.' : 'Сначала выбирает первый игрок, потом телефон переходит ко второму.'}</li><li><span class="tch">Тяните карточку вправо — «нравится», влево — «не нравится».</span><span class="dsk">Нажимайте «Нравится» или «Не нравится», работают и стрелки ← →.</span></li><li>${on ? 'Если понравилось обоим, появится «Мэтч!».' : 'Фильмы, которые понравились обоим, попадут в совпадения.'}</li></ol><button class="btn" data-act="introok">Понятно</button></div></div>`;
function showIntro(force, on) {
  try {
    if (!force && localStorage.getItem('wwy_intro_v1')) return;
    if (document.getElementById('intro')) return;
    document.body.insertAdjacentHTML('beforeend', introHTML(on));
    document.getElementById('intro').addEventListener('click', clickAll);
  } catch (e) {}
}
const pst = () => o.theirs[o.i] !== undefined ? 'партнёр уже выбрал ✓' : 'партнёр выбирает…';
const paint = () => { try { const e = document.getElementById('pst'); if (e) e.textContent = pst(); } catch (err) {} };
const KW = {movie: 'фильм', tv: 'сериал', anim: 'мультфильм'};
const CLASSIC = '🎞 Классика';
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', PFX = 'moviepick-';

const s = {mode:'solo', gtab:'pop', kind:'movie', step:0, mtab:'pop', moods:new Set(), presets:new Set(), manual:new Set(), removed:new Set(), runtime:'', era:'', rating:'6', names:['','']};
let v = null, o = null, peer = null, conn = null, joinTimer = null;
const $ = q => document.querySelector(q);
const app = $('#app');

const nm = p => s.names[p].trim() || 'Игрок ' + (p + 1);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const panel = h => app.innerHTML = `<section class="panel">${h}</section>`;
const fail = msg => panel(`<p class="err">${esc(msg)}</p><button class="btn" data-act="back">Назад</button>`);
function cleanup() { clearTimeout(joinTimer); try { conn && conn.close(); } catch (e) {} try { peer && peer.destroy(); } catch (e) {} conn = peer = v = o = null; }

function lnk(m) {
  const y = (m.release_date || '').slice(0, 4), q = s => encodeURIComponent(m.title + ' ' + y + s);
  return `<div class="links"><a class="lnk f" href="https://yandex.ru/search/?text=${q('')}" target="_blank" rel="noopener noreferrer">🔍 Найти</a><a class="lnk t" href="https://www.youtube.com/results?search_query=${q(' трейлер')}" target="_blank" rel="noopener noreferrer">▶ Трейлер</a></div>`;
}
function ticket(m, links) {
  const year = (m.release_date || '').slice(0, 4);
  const g = (m.genre_ids || []).map(id => NAMES[id]).filter(Boolean).slice(0, 3).map(n => '#\u00a0' + n).join(' ');
  return `<article class="ticket">
<img src="https://whattowatch.dbuyanov05.workers.dev/image/w342${m.poster_path}" alt="Постер: ${esc(m.title)}" loading="lazy">
  <div class="info"><h3>${esc(m.title)}</h3><p class="meta"><span>${esc((KIND[m.k] || '') + ' ' + year)}</span><span class="star">★ ${Number(m.vote_average).toFixed(1)}</span><span class="tags">${esc(g)}</span></p><p class="ov">${esc(m.overview)}</p>${links ? lnk(m) : ''}</div></article>`;
}

function swipe(m, first) { return `<div class="card${first ? ' nudge' : ''}">${ticket(m)}<span class="tag lk">НРАВИТСЯ</span><span class="tag np">НЕ НРАВИТСЯ</span></div><div class="edges"><span>← Не нравится</span><span>Нравится →</span></div>`; }
const kindGenres = () => (s.kind === 'tv' ? Object.keys(GT) : Object.keys(GM)).map(Number).filter(id => s.kind !== 'anim' || id !== 16);
const MODEH = {solo: 'Покажем список подходящих фильмов.', duo: 'Играете по очереди на одном телефоне, потом смотрите совпадения.', online: 'Каждый на своём устройстве, фильмы у вас одни и те же.'};
const summary = (eff, names) => { const gn = [...eff].map(id => names[id] || NAMES[id]).filter(Boolean); return 'Подберём: ' + (gn.length ? gn.slice(0, 4).join(', ') + (gn.length > 4 ? '…' : '') : 'любые жанры') + ' · рейтинг: ' + RATING[s.rating].toLowerCase() + ' · годы: ' + ERAS[s.era][0].toLowerCase(); };
function side() {
  const tv = s.kind === 'tv', online = s.mode === 'online', kg = kindGenres(), names = tv ? GT : GM;
  const btn = (act, v, label, on) => `<button data-act="${act}" data-v="${v}"${on === undefined ? '' : ` aria-pressed="${on}"`}>${label}</button>`;
  const sel = (key, map) => Object.entries(map).map(([k, a]) => `<option value="${k}" ${String(s[key]) === k ? 'selected' : ''}>${Array.isArray(a) ? a[0] : a}</option>`).join('');
  const steps = [['kind', 'Формат'], ['mood', 'Настроение'], ...(s.kind === 'movie' ? [['eve', 'Вечер']] : []), ['genre', 'Жанры'], ['more', 'Детали']];
  s.step = Math.min(s.step, steps.length - 1);
  const eff = effSet(), cnt = {mood: s.moods.size, eve: s.presets.size, genre: eff.size}, cur = steps[s.step][0];
  const moods = Object.keys(MOODS).filter(n => MOODS[n][tv ? 1 : 0]), mlist = s.mtab === 'pop' ? MPOP.filter(n => moods.includes(n)) : moods;
  const gbase = s.gtab === 'pop' ? POP[tv ? 'tv' : 'movie'].filter(id => kg.includes(id)) : kg;
  const glist = [...gbase, ...[...new Set([...eff, ...s.removed])].filter(id => kg.includes(id) && !gbase.includes(id))];
  const tabs = (act, on, b) => `<div class="seg small" role="group" style="margin-bottom:10px">${btn(act, 'pop', 'Популярные', on === 'pop')}${btn(act, 'all', b, on === 'all')}</div>`;

let lastTotal = 0;
const tog = (set, v) => { if (set.has(v)) { set.delete(v); return false; } set.add(v); return true; };
const MPOP = ['😂 Посмеяться', '💥 Адреналин', '💜 Романтика', '😱 Страшно', '🧠 Поломать голову', '🌿 Расслабиться'];

const effSet = () => {
  const tv = s.kind === 'tv', u = new Set(s.manual);
  s.moods.forEach(n => ((MOODS[n] && MOODS[n][tv ? 1 : 0]) || []).forEach(g => u.add(g)));
  s.presets.forEach(n => PRESETS[n].g.forEach(g => u.add(g)));
  s.removed.forEach(g => u.delete(g));
  return u;
};
function groups() { const e = effSet(); return e.size ? [e] : []; }
function excluded() {
  const u = new Set(groups().flatMap(g => [...g]));
  return u.has(10751) ? new Set([28, 27, 53, 80, 10752, 10759, 10768].filter(id => !u.has(id))) : new Set();
}
function prune() {

}
function buildUrl(page) {
  const tv = s.kind === 'tv', gl = groups().sort((a, b) => a.size - b.size)[0], gens = s.kind === 'anim' ? '16' : gl ? [...gl].join('|') : '';
  let era = ERAS[s.era][1];

    + (+s.rating ? `&vote_average.gte=${s.rating}` : '') + (gens ? `&with_genres=${gens}` : '') + (s.kind === 'movie' ? '&without_genres=16' : '') + (tv ? '' : RUNTIME[s.runtime][1]) + era;
}
const RAW = new Map();
const getJson = async u => {
  let lastError;

  for (let attempt = 0; attempt < 2; attempt++) {
    const ac = new AbortController();
    const tm = setTimeout(() => ac.abort(), 12000);

    try {
      const res = await fetch(u, { signal: ac.signal });
      let d;
      try {
        d = await res.json();
      } catch {
        throw new Error('Сервер вернул некорректный ответ (HTTP ' + res.status + ')');
      }

      if (!res.ok) {
        const error = new Error(d.status_message || 'Ошибка ' + res.status);
        error.status = res.status;
        throw error;
      }

      return d;
    } catch (e) {
      lastError = e;
      const status = e.status;
      const retryable = !status || status >= 500 || status === 408 || status === 429;

      if (!retryable || attempt === 1) break;

      await new Promise(resolve =>
        setTimeout(resolve, 500 + Math.random() * 500)
      );
    } finally {
      clearTimeout(tm);
    }
  }

  throw new Error(
    lastError?.name === 'AbortError'
      ? 'сервер подбора не отвечает (тайм-аут запроса)'
      : 'Не удалось загрузить данные: ' + (lastError?.message || 'неизвестная ошибка')
  );
};

let NEED = 2, relaxed = false;
async function fetchPage(page) {
  const url = buildUrl(page);
  let r = RAW.get(url);

  if (!r) {
    const parts = await Promise.allSettled([
      getJson(url + '&part=1'),
      getJson(url + '&part=2')
    ]);

    const successful = parts
      .filter(x => x.status === 'fulfilled')
      .map(x => x.value);

    if (!successful.length) {
      throw new Error('Не удалось загрузить страницу ' + page);
    }

    const ids = new Set();
    const total = successful[0].total_pages || 0;
    const list = successful
      .flatMap(x => x.results || [])
      .filter(m =>
        m.poster_path &&
        m.overview &&
        !ids.has(m.id) &&
        ids.add(m.id)
      )
      .map(m => ({
        id: m.id,
        title: m.title || m.name,
        release_date: m.release_date || m.first_air_date,
        vote_average: m.vote_average,
        genre_ids: m.genre_ids || [],
        overview: m.overview,
        poster_path: m.poster_path,
        k: s.kind
      }));

    r = { total, list };

    // Сохраняем в кеш только страницу, для которой загрузились обе части.
    if (successful.length === 2) RAW.set(url, r);
  }

  lastTotal = r.total;
  const e = effSet(), ex = excluded(), need = Math.min(NEED, e.size);

  return r.list.filter(m =>
    m.genre_ids.filter(id => e.has(id)).length >= need &&
    !m.genre_ids.some(id => ex.has(id))
  );
}

const SK = 'wwy_seen_v1', TTL = 30 * 864e5, sk = m => (m.k === 'tv' ? 't' : 'm') + m.id;
let resetNote = false;
function seenLoad() { try { const d = JSON.parse(localStorage.getItem(SK) || '{}'), now = Date.now(); for (const k in d) if (now - d[k] > TTL) delete d[k]; return d; } catch (e) { return {}; } }
function mark(list) { try { const d = seenLoad(), now = Date.now(); list.forEach(m => d[sk(m)] = now); localStorage.setItem(SK, JSON.stringify(d)); } catch (e) {} }

function pager() {
  const P = { pages: null, seen: seenLoad(), sess: new Set() };
  const attempts = new Map();

  P.next = async () => {
    if (!P.pages) {
      // Не даём старому поиску повлиять на число страниц нового поиска.
      lastTotal = 0;

      try {
        await fetchPage(1);
      } catch (e) {
        console.warn('Не удалось сразу загрузить первую страницу:', e);
      }

      const total = Math.min(lastTotal || 25, 25);
      P.pages = shuffle(
        Array.from({ length: total }, (_, k) => k + 1)
      );
    }

    while (P.pages.length) {
      const batch = P.pages.splice(0, 4);
      const settled = await Promise.allSettled(batch.map(fetchPage));
      const lists = [];

      settled.forEach((result, i) => {
        const page = batch[i];

        if (result.status === 'fulfilled') {
          attempts.delete(page);
          lists.push(result.value);
          return;
        }

        const count = (attempts.get(page) || 0) + 1;
        attempts.set(page, count);

        if (count < 2) {
          P.pages.push(page);
        } else {
          console.warn(
            `Не удалось загрузить страницу ${page} после повторной попытки:`,
            result.reason
          );
        }
      });

      const now = new Set();
      const list = lists.flat().filter(m => {
        const k = sk(m);
        if (P.seen[k] || P.sess.has(k) || now.has(k)) return false;
        now.add(k);
        return true;
      });

      if (list.length) {
        list.forEach(m => P.sess.add(sk(m)));
        return shuffle(list);
      }
    }

    return [];
  };

  return P;
}

async function fetchDeck(n) {
  const fill = async P => { const got = []; while (got.length < n) { const l = await P.next(); if (!l.length) break; got.push(...l); } return got; };
  const again = () => { const P = pager(); P.seen = {}; return fill(P); };
  resetNote = relaxed = false; NEED = 2;
  let got = await fill(pager());
  if (!got.length) { resetNote = true; got = await again(); }
  if (!got.length && effSet().size > 1) {
    resetNote = false; relaxed = true; NEED = 1;
    got = await fill(pager());
    if (!got.length) { resetNote = true; got = await again(); }
    NEED = 2;
  }
  got = got.slice(0, n); mark(got); return got;
}

// ---- Онлайн-режим: бесконечная лента, оба видят один фильм (WebRTC через PeerJS) ----
const newO = host => ({q: [], i: 0, mine: {}, theirs: {}, matches: [], host, P: null, reset: false, loading: false, exhausted: false, inMatch: false, finished: false, err: ''});
const send = m => { try { conn && conn.send(m); } catch (e) {} };

async function more() {
  const me = o;
  if (!me || !me.host || me.loading || me.exhausted) return;
  me.loading = true;
  try {
    if (!me.P) me.P = pager();
    let got = await me.P.next();
    if (!got.length && !me.reset) { me.reset = true; const sess = me.P.sess; me.P = pager(); me.P.seen = {}; me.P.sess = sess; got = await me.P.next(); }
    if (!got.length && !me.relaxed && effSet().size > 1) { me.relaxed = true; NEED = 1; const sess = me.P.sess; me.P = pager(); me.P.sess = sess; got = await me.P.next(); }
    if (got.length) { me.q.push(...got); mark(got); send({t: 'movies', list: got}); }
    else { me.exhausted = true; send({t: 'exh'}); }
  } catch (e) { me.err = e.message; me.exhausted = true; send({t: 'exh'}); }
  me.loading = false;
  if (o === me && !me.inMatch && !me.finished && me.q[me.i] === undefined) onv();
}

function step() {
  while (o.mine[o.i] !== undefined && o.theirs[o.i] !== undefined) {
    const m = o.q[o.i], both = o.mine[o.i] && o.theirs[o.i];
    o.i++;
    if (both) { o.matches.push(m); return showMatch(m); }
  }
  if (o.host && o.q.length - o.i < 6) more();
  onv();
}

function onv() {
  const m = o.q[o.i], fin = (o.matches.length ? '<button class="btn alt" data-act="mlist">Мои мэтчи (' + o.matches.length + ')</button>' : '') + '<button class="btn alt" data-act="finish">Закончить подбор</button>';
  o.empty = !m;
  if (!m) return panel(`<p class="msg">${o.exhausted ? 'Фильмы по вашим условиям закончились.' : 'Загружаем следующие фильмы…'}</p>${fin}`);
  if (o.mine[o.i] !== undefined) return panel(`<p class="prog">Мэтчей: ${o.matches.length}</p>${ticket(m)}<p class="wait">Вы выбрали: <b>${o.mine[o.i] ? 'Нравится ♥' : 'Не нравится ✕'}</b>. Партнёр ещё решает…</p>${fin}`);
  app.innerHTML = `<section class="panel vote"><p class="prog">Мэтчей: ${o.matches.length} · <span id="pst">${pst()}</span></p>${o.i === 0 ? hint(true) : ''}${swipe(m, o.i === 0)}
  <div class="vbtns"><button class="no" data-act="ono">✕ Не нравится</button><button class="yes" data-act="oyes">♥ Нравится</button></div>${fin}</section>`;
  if (o.i === 0) showIntro(false, true);
}

function ovote(like) {
  if (!o || o.mine[o.i] !== undefined || !o.q[o.i]) return;
  o.mine[o.i] = like; send({t: 'vote', i: o.i, like}); step();
}

function showMatch(m) {
  o.inMatch = true;
  try { navigator.vibrate && navigator.vibrate([70, 50, 140]); } catch (e) {}
  panel(`<div class="match"><div class="heart">♥</div><h2 class="mt">Мэтч!</h2><p class="msg">Вам обоим хочется посмотреть этот фильм.</p>${ticket(m, true)}
  <button class="btn" data-act="mnext">Искать дальше</button><button class="btn alt" data-act="mlist">Мои мэтчи (${o.matches.length})</button><button class="btn alt" data-act="finish">Закончить подбор</button><p class="hint">Мэтчи сохраняются. Посмотреть их можно кнопкой «Мои мэтчи» или завершить подбор.</p></div>`);

function showList() {

function showFinal(note) {

function finish() { if (!o) return; o.finished = true; send({t: 'end'}); showFinal(''); }

function onData(m) {
  if (m.t === 'movies') {
    clearTimeout(joinTimer);
    const first = !o;
    if (!o) o = newO(false);
    o.q.push(...m.list);
    if (!o.inMatch && !o.finished && (first || o.empty)) step();
  } else if (!o) return;
  else if (m.t === 'vote') { o.theirs[m.i] = m.like; if (!o.inMatch && !o.finished) { if (o.mine[o.i] === undefined && m.i === o.i) paint(); else step(); } }
  else if (m.t === 'exh') { o.exhausted = true; if (!o.inMatch && !o.finished) onv(); }
  else if (m.t === 'end') { if (!o.finished) { o.finished = true; showFinal('Партнёр закончил подбор.'); } }
}
function onClose() { if (o && !o.finished) { o.finished = true; showFinal('Партнёр отключился.'); } }

async function create() {
  enterPlay();
  if (typeof Peer === 'undefined') return fail('Не загрузилась библиотека связи (PeerJS). Проверьте интернет.');
  panel('<p class="msg">Готовим комнату…</p>');
  o = newO(true); NEED = 2;
  await more();
  if (!o.q.length) { const e = o.err; cleanup(); return e ? fail('Не удалось загрузить фильмы: ' + e) : none(); }
  const code = Array.from({length: 5}, () => ALPH[Math.floor(Math.random() * ALPH.length)]).join('');
  const link = location.href.split('#')[0] + '#' + code;
  peer = new Peer(PFX + code);
  peer.on('open', () => panel(`<h3>Комната создана</h3><p class="msg">Партнёр открывает сайт, выбирает «Вдвоём (онлайн)» и вводит код. Или отправьте ему ссылку.</p>
    <div class="code">${code}</div><p class="link">${esc(link)}</p>
    <button class="btn" data-act="copy" data-v="${esc(link)}">Скопировать ссылку</button><button class="btn alt" data-act="back">Отмена</button><p class="msg" style="margin-top:14px">Ждём партнёра…</p>`));
  peer.on('connection', c => {
    if (conn) return c.close();
    conn = c;
    c.on('open', () => { send({t: 'movies', list: o.q}); if (o.exhausted) send({t: 'exh'}); step(); });
    c.on('data', onData); c.on('close', onClose);
  });
  peer.on('error', e => fail('Ошибка соединения: ' + e.type + '. Попробуйте ещё раз.'));
}

function join(code) {
  enterPlay();
  code = (code || '').trim().toUpperCase();
  if (!code) return;
  if (typeof Peer === 'undefined') return fail('Не загрузилась библиотека связи (PeerJS). Проверьте интернет.');
  panel('<p class="msg">Подключаемся…</p>');
  joinTimer = setTimeout(() => fail('Не удалось подключиться. Проверьте код и что партнёр не закрыл страницу.'), 15000);
  peer = new Peer();
  peer.on('open', () => { conn = peer.connect(PFX + code, {reliable: true}); conn.on('data', onData); conn.on('close', onClose); });
  peer.on('error', e => { clearTimeout(joinTimer); fail(e.type === 'peer-unavailable' ? 'Комната с таким кодом не найдена.' : 'Ошибка соединения: ' + e.type); });
}

const clickAll = e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, x = b.dataset.v;
  if (a === 'mode') { s.mode = x; setup(); }
  else if (a === 'gtab') { s.gtab = x; side(); }
  else if (a === 'mtab') { s.mtab = x; side(); }
  else if (a === 'step') { s.step = +x; side(); }
  else if (a === 'next') { s.step++; side(); }
  else if (a === 'prev') { s.step = Math.max(0, s.step - 1); side(); }
  else if (a === 'kind') { s.kind = x; prune(); side(); }
  else if (a === 'mood') { if (tog(s.moods, x)) ((MOODS[x][s.kind === 'tv' ? 1 : 0]) || []).forEach(g => s.removed.delete(g)); side(); }
  else if (a === 'preset') { const on = tog(s.presets, x); if (on) PRESETS[x].g.forEach(g => s.removed.delete(g)); if (x === CLASSIC) s.era = on ? 'old' : (s.era === 'old' ? '' : s.era); side(); }
  else if (a === 'genre') { const id = +x; if (effSet().has(id)) { s.manual.delete(id); s.removed.add(id); } else { s.removed.delete(id); s.manual.add(id); } side(); }
  else if (a === 'random') { s.moods.clear(); s.presets.clear(); s.manual.clear(); s.removed.clear(); if (s.era === 'old') s.era = ''; side(); if (s.mode === 'online') create(); else go(); }
  else if (a === 'go') go();
  else if (a === 'create') create();
  else if (a === 'join') join($('#jc').value);
  else if (a === 'back') { cleanup(); setup(); }
  else if (a === 'yes') answer(true);
  else if (a === 'no') answer(false);
  else if (a === 'oyes') ovote(true);
  else if (a === 'ono') ovote(false);
  else if (a === 'mnext') { o.inMatch = false; step(); }
  else if (a === 'finish') finish();
  else if (a === 'mlist') showList();
  else if (a === 'help') showIntro(true, s.mode === 'online');
  else if (a === 'introok') { const el = document.getElementById('intro'); if (el) el.remove(); try { localStorage.setItem('wwy_intro_v1', '1'); } catch (err) {} }
  else if (a === 'start2') { v.p = 1; v.i = 0; vote(); }
  else if (a === 'copy') { navigator.clipboard.writeText(x).then(() => b.textContent = 'Скопировано').catch(() => {}); }
};
const changeAll = e => { const k = e.target.dataset.sel; if (!k) return; s[k] = e.target.value; if (k === 'era' && s.era !== 'old') s.presets.delete(CLASSIC); side(); };
const inputAll = e => { if (e.target.id === 'jc') e.target.value = e.target.value.toUpperCase().replace(/\s/g, ''); if (e.target.dataset.name) s.names[+e.target.dataset.name] = e.target.value; };
[app, $('#side'), $('#bar')].forEach(el => { el.addEventListener('click', clickAll); el.addEventListener('change', changeAll); el.addEventListener('input', inputAll); });

let drag = null;
app.addEventListener('pointerdown', e => { const c = e.target.closest('.card'); if (e.pointerType === 'mouse' || !c || e.target.closest('button')) return; drag = {c, x: e.clientX, dx: 0}; try { c.setPointerCapture(e.pointerId); } catch (err) {} c.style.transition = 'none'; });
app.addEventListener('pointermove', e => { if (!drag) return; drag.dx = e.clientX - drag.x; drag.c.style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 25}deg)`; drag.c.style.setProperty('--l', Math.max(0, drag.dx / 100)); drag.c.style.setProperty('--n', Math.max(0, -drag.dx / 100)); });
const endDrag = () => { if (!drag) return; const {c, dx} = drag; drag = null; c.style.transition = 'transform .2s'; if (Math.abs(dx) > 90) { const b = document.querySelector(dx > 0 ? '.vbtns .yes' : '.vbtns .no'); if (b) b.click(); } else { c.style.transform = ''; c.style.setProperty('--l', 0); c.style.setProperty('--n', 0); } };
app.addEventListener('pointerup', endDrag); app.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => { if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; const b = document.querySelector(e.key === 'ArrowRight' ? '.vbtns .yes' : '.vbtns .no'); if (b) b.click(); });

const hello = $('#hello');
let seenHello = false;
try { seenHello = !!localStorage.getItem('wwy_hello_v1'); } catch (e) {}
const hideHello = () => { hello.remove(); try { localStorage.setItem('wwy_hello_v1', '1'); } catch (e) {} };
hello.addEventListener('click', hideHello);
const hash = location.hash.slice(1);
if (hash) { hello.remove(); s.mode = 'online'; join(hash); }
else if (seenHello) { hello.remove(); setup(); }
else { setup(); setTimeout(hideHello, 4000); }
</script>
</body>
</html>
